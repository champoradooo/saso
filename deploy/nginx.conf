server {
    listen 80;
    server_name 47.130.246.172;

    client_max_body_size 20M;

    # Django static files
    location /static/ {
        alias /home/ubuntu/saso-app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media files
    location /media/ {
        alias /home/ubuntu/saso-app/media/;
    }

    # Django API + admin — proxy to Gunicorn
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # React SPA — serve built files, fallback to index.html
    location / {
        root /home/ubuntu/saso-app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
